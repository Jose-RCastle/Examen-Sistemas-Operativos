name: Pruebas del motor MMU
on: [push, pull_request]
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
        env:
          MMU_SCREENSHOT_DIR: qa-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-visual
          path: qa-images/
          if-no-files-found: ignore
          retention-days: 7
